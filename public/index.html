<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="VIDHWAAN NEET — 365-Day NEET Preparation"
  >

  <meta
    name="application-name"
    content="VIDHWAAN NEET"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="VIDHWAAN NEET"
  >

  <title>VIDHWAAN NEET — 365-Day Preparation</title>

  <link rel="manifest" href="/manifest.json">

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="/icons/icon-192.png"
  >

  <link rel="stylesheet" href="/main.css">
</head>

<body>

  <div id="app">

    <div class="app-shell">

      <!-- ==================================================
           HEADER
           ================================================== -->

      <header class="app-header">

        <div class="header-inner">

          <div class="brand">

            <img
              class="brand-logo"
              src="/icons/icon-192.png"
              alt="VIDHWAAN NEET"
              width="42"
              height="42"
            >

            <div class="brand-text">

              <h1 class="brand-title">
                VIDHWAAN NEET
              </h1>

              <p class="brand-subtitle">
                365-Day NEET Preparation
              </p>

            </div>

          </div>

        </div>

      </header>


      <!-- ==================================================
           MAIN APPLICATION
           ================================================== -->

      <main class="main-container">

        <!-- ==================================================
             DAY SELECTION VIEW
             ================================================== -->

        <section
          id="days-view"
          class="days-view"
          aria-label="NEET course days"
        >

          <div class="page-heading">

            <h1>
              365-Day NEET Preparation
            </h1>

            <p>
              Select an available day to start your preparation.
            </p>

          </div>


          <div class="course-card">

            <div class="course-header">

              <div>

                <h2>
                  Course Days
                </h2>

                <p>
                  Your daily NEET preparation journey
                </p>

              </div>

            </div>


            <!--
              app.js creates all 365 circles here.

              IMPORTANT:
              The HTML does NOT contain individual day buttons.
              JavaScript creates them from Day 1 through Day 365.
            -->

            <div
              id="days-grid"
              class="days-grid"
              aria-label="365 course days"
            ></div>


            <div
              class="days-legend"
              aria-label="Day status"
            >

              <div class="legend-item">

                <span
                  class="legend-dot active"
                  aria-hidden="true"
                ></span>

                <span>
                  Available
                </span>

              </div>


              <div class="legend-item">

                <span
                  class="legend-dot"
                  aria-hidden="true"
                ></span>

                <span>
                  Locked
                </span>

              </div>

            </div>

          </div>

        </section>


        <!-- ==================================================
             LESSON VIEW
             ================================================== -->

        <section
          id="lesson-view"
          class="lesson-view hidden"
          aria-label="NEET daily lesson"
        >

          <!--
            app.js fills this entire section dynamically.

            It will contain:
            - Back button
            - Day title
            - Subject/chapter information
            - Learning outcomes
            - All syllabus topics
            - Key points
            - NEET tips
            - MCQs
            - Answer state
            - Explanation
          -->

          <div id="lesson-container"></div>

        </section>


        <!-- ==================================================
             GLOBAL LOADING VIEW
             ================================================== -->

        <section
          id="loading-view"
          class="loading-state hidden"
          aria-live="polite"
        >

          <div
            class="loading-spinner"
            aria-hidden="true"
          ></div>

          <div>
            Loading...
          </div>

        </section>


        <!-- ==================================================
             GLOBAL ERROR VIEW
             ================================================== -->

        <section
          id="error-view"
          class="error-state hidden"
          aria-live="assertive"
        >

          <h2>
            Something went wrong
          </h2>

          <p id="error-message">
            We could not load the lesson.
          </p>

        </section>

      </main>


      <!-- ==================================================
           FOOTER
           ================================================== -->

      <footer class="app-footer">

        <p>
          VIDHWAAN NEET — 365-Day NEET Preparation
        </p>

      </footer>

    </div>

  </div>


  <!-- ======================================================
       APPLICATION JAVASCRIPT
       ====================================================== -->

  <script
    src="/app.js"
    defer
  ></script>

</body>
</html>
