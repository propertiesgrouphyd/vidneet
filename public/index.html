<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="VIDHWAAN NEET — 365-Day NEET Preparation"
    >

    <meta
        name="application-name"
        content="VIDHWAAN NEET"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="VIDHWAAN NEET"
    >

    <title>VIDHWAAN NEET</title>

    <link
        rel="icon"
        href="./icons/favicon.ico"
    >

    <link
        rel="apple-touch-icon"
        href="./icons/icon-192.png"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./css/main.css"
    >
</head>

<body>

<div class="app-shell">

    <!-- ======================================================
         HEADER
         ====================================================== -->

    <header class="app-header">

        <div class="app-header-inner">

            <a
                href="./"
                class="app-brand"
                aria-label="VIDHWAAN NEET Home"
            >

                <img
                    src="./icons/logo.png"
                    alt="VIDHWAAN NEET"
                    width="46"
                    height="46"
                >

                <div class="app-brand-text">

                    <h1 class="app-brand-title">
                        VIDHWAAN NEET
                    </h1>

                    <p class="app-brand-subtitle">
                        365-Day NEET Preparation
                    </p>

                </div>

            </a>

        </div>

    </header>


    <!-- ======================================================
         MAIN APPLICATION
         ====================================================== -->

    <main>

        <div class="container page-content">

            <!-- ==================================================
                 COURSE STATUS
                 ================================================== -->

            <section
                class="status-card"
                aria-label="Course status"
            >

                <div class="syllabus-summary">
                    <strong id="syllabus-summary">
                        365-Day NEET Preparation
                    </strong>
                </div>

                <div
                    class="release-status"
                    aria-live="polite"
                >

                    <span
                        id="release-status-text"
                    >
                        Loading...
                    </span>

                </div>

                <div
                    id="today-badge"
                    class="today-badge"
                    aria-live="polite"
                >

                    <span
                        class="today-badge-dot"
                        aria-hidden="true"
                    ></span>

                    <span id="today-badge-text">
                        Loading
                    </span>

                </div>

            </section>


            <!-- ==================================================
                 365-DAY GRID

                 IMPORTANT:
                 This is intentionally empty.

                 app.js creates all Day 1–365 buttons.

                 The student application does NOT load
                 syllabus.json.
                 ================================================== -->

            <section
                id="day-grid"
                class="day-grid"
                aria-label="365-Day NEET course days"
            ></section>


            <!-- ==================================================
                 LOADING
                 ================================================== -->

            <div
                id="loading-state"
                class="loading-state"
            >

                <div
                    class="loading-spinner"
                    aria-hidden="true"
                ></div>

                <p>
                    Loading VIDHWAAN NEET...
                </p>

            </div>


            <!-- ==================================================
                 ERROR
                 ================================================== -->

            <div
                id="error-state"
                class="error-state hidden"
                role="alert"
            >

                <div
                    class="error-icon"
                    aria-hidden="true"
                >
                    !
                </div>

                <h3>
                    Unable to load the course
                </h3>

                <p id="error-message">
                    Please check your connection and try again.
                </p>

                <button
                    id="retry-button"
                    class="gold-button"
                    type="button"
                >
                    Try Again
                </button>

            </div>

        </div>

    </main>


    <!-- ======================================================
         FOOTER
         ====================================================== -->

    <footer class="footer">

        <div class="footer-inner">

            <div class="footer-brand">

                <img
                    src="./icons/logo.png"
                    alt="VIDHWAAN"
                    width="40"
                    height="40"
                >

                <div>

                    <strong>
                        VIDHWAAN NEET
                    </strong>

                    <span>
                        365-Day NEET Preparation
                    </span>

                </div>

            </div>

            <div class="footer-copy">
                © VIDHWAAN
            </div>

        </div>

    </footer>

</div>


<!-- ==========================================================
     PWA INSTALL BUTTON
     ========================================================== -->

<button
    id="install-button"
    class="install-button hidden"
    type="button"
    aria-label="Install VIDHWAAN NEET"
>

    <span
        class="install-icon"
        aria-hidden="true"
    >
        ↓
    </span>

    <span class="install-text">
        Install App
    </span>

</button>


<!-- ==========================================================
     APPLICATION JAVASCRIPT
     ========================================================== -->

<script
    src="./js/app.js"
    defer
></script>

</body>
</html>
