
name: VIDHWAAN NEET — Daily AI Lesson

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: vidhwaan-neet-daily-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate or Resume NEET Lesson
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # NODE
      # ------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------
      # SYLLABUS VALIDATION
      # ------------------------------------------------------

      - name: Validate syllabus
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — SYLLABUS VALIDATION"
          echo "============================================================"

          npm run validate

      # ------------------------------------------------------
      # GROQ SECRET VALIDATION
      # ------------------------------------------------------

      - name: Validate Groq secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "ERROR: GROQ_API_KEY GitHub Secret is missing."
            exit 1
          fi

          if [ -z "${GROQ_API_KEY_2:-}" ]; then
            echo "ERROR: GROQ_API_KEY_2 GitHub Secret is missing."
            exit 1
          fi

          case "$GROQ_API_KEY" in
            gsk_*) echo "Primary Groq API key configured." ;;
            *)
              echo "ERROR: Invalid primary Groq key format."
              exit 1
              ;;
          esac

          case "$GROQ_API_KEY_2" in
            gsk_*) echo "Secondary Groq API key configured." ;;
            *)
              echo "ERROR: Invalid secondary Groq key format."
              exit 1
              ;;
          esac

      # ------------------------------------------------------
      # RESTORE PREVIOUS PROGRESS ARTIFACT
      # ------------------------------------------------------

      - name: Restore previous generation progress
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail

          mkdir -p generator-progress

          echo "============================================================"
          echo " VIDHWAAN NEET — RESTORING PREVIOUS PROGRESS"
          echo "============================================================"

          # Find earlier completed runs of this workflow.
          RUNS=$(gh api \
            "repos/${GH_REPO}/actions/workflows/daily-ai-lesson.yml/runs?branch=main&status=completed&per_page=30" \
            --jq '.workflow_runs[] | select(.id != '"${CURRENT_RUN_ID}"') | .id')

          FOUND=false

          for RUN_ID in $RUNS; do

            echo "Checking previous workflow run: $RUN_ID"

            ARTIFACT_ID=$(gh api \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name == "neet-generation-progress" and .expired == false) | .id' \
              | head -n 1)

            if [ -z "$ARTIFACT_ID" ]; then
              continue
            fi

            echo "Previous progress artifact found."

            mkdir -p /tmp/neet-progress-artifact

            gh api \
              "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > /tmp/neet-progress-artifact/progress.zip

            unzip -o \
              /tmp/neet-progress-artifact/progress.zip \
              -d generator-progress

            FOUND=true

            echo "Progress restored from run: $RUN_ID"

            break

          done

          if [ "$FOUND" = false ]; then
            echo "No previous progress artifact found."
            echo "Starting a new generation."
          fi

          echo ""
          echo "Restored progress files:"

          find generator-progress \
            -maxdepth 2 \
            -type f \
            -print

      # ------------------------------------------------------
      # GENERATE OR RESUME LESSON
      # ------------------------------------------------------

      - name: Generate or resume daily lesson
        id: generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: |
          set -uo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — DAILY AI GENERATION"
          echo "============================================================"

          set +e

          node generator/generate-day.js

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then

            echo "quota_exhausted=false" >> "$GITHUB_OUTPUT"

            echo "Generation completed successfully."

          elif [ "$EXIT_CODE" -eq 2 ]; then

            echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"

            echo "Groq daily quota exhausted."
            echo "Progress will be uploaded as an artifact."
            echo "The incomplete lesson will NOT be pushed."

          else

            echo "Generation failed with exit code: $EXIT_CODE"

            exit "$EXIT_CODE"

          fi

      # ------------------------------------------------------
      # SAVE PROGRESS ARTIFACT
      # ------------------------------------------------------

      - name: Save generation progress artifact
        if: steps.generate.outputs.quota_exhausted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neet-generation-progress
          path: generator-progress/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      # ------------------------------------------------------
      # STOP SUCCESSFULLY AFTER QUOTA PAUSE
      # ------------------------------------------------------

      - name: Report paused generation
        if: steps.generate.outputs.quota_exhausted == 'true'
        run: |
          echo "============================================================"
          echo " VIDHWAAN NEET — GENERATION PAUSED"
          echo "============================================================"
          echo ""
          echo "Progress artifact uploaded successfully."
          echo "Run this workflow again after the Groq daily quota resets."
          echo "Generation will resume from the saved checkpoint."
          echo ""
          echo "No incomplete lesson was pushed to the repository."

      # ------------------------------------------------------
      # VERIFY GENERATED FILES
      # ------------------------------------------------------

      - name: Verify generated lesson
        if: steps.generate.outputs.quota_exhausted != 'true'
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — GENERATED LESSON VERIFICATION"
          echo "============================================================"

          mkdir -p public/data

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          data_dir = Path("public/data")

          files = sorted(
              data_dir.glob("day-*.json"),
              key=lambda p: int(p.stem.split("-")[1])
          )

          if len(files) > 365:
              raise SystemExit(
                  f"ERROR: More than 365 lesson files exist: {len(files)}"
              )

          if not files:
              raise SystemExit(
                  "ERROR: No lesson files exist after generation."
              )

          expected = 1

          for f in files:
              match = re.fullmatch(r"day-(\d{3})", f.stem)

              if not match:
                  raise SystemExit(
                      f"ERROR: Invalid lesson filename: {f.name}"
                  )

              day = int(match.group(1))

              if day != expected:
                  raise SystemExit(
                      f"ERROR: Lesson sequence broken. "
                      f"Expected Day {expected}, found Day {day}"
                  )

              try:
                  content = json.loads(
                      f.read_text(encoding="utf-8")
                  )
              except Exception as e:
                  raise SystemExit(
                      f"ERROR: Invalid JSON in {f}: {e}"
                  )

              if int(content.get("day", 0)) != day:
                  raise SystemExit(
                      f"ERROR: {f}: day metadata mismatch."
                  )

              if not content.get("courseDate"):
                  raise SystemExit(
                      f"ERROR: {f}: missing courseDate."
                  )

              if not content.get("publishAt"):
                  raise SystemExit(
                      f"ERROR: {f}: missing publishAt."
                  )

              if not isinstance(content.get("sections"), list):
                  raise SystemExit(
                      f"ERROR: {f}: sections must be an array."
                  )

              if not isinstance(content.get("mcqs"), list):
                  raise SystemExit(
                      f"ERROR: {f}: mcqs must be an array."
                  )

              if len(content["sections"]) == 0:
                  raise SystemExit(
                      f"ERROR: {f}: lesson contains no sections."
                  )

              if len(content["mcqs"]) == 0:
                  raise SystemExit(
                      f"ERROR: {f}: lesson contains no MCQs."
                  )

              expected += 1

          latest = files[-1]

          print(f"Lesson files : {len(files)}")
          print(f"Latest lesson: {latest.name}")
          print("Sequence     : VALID")
          print("JSON         : VALID")
          print("Content      : VALID")
          PY

      # ------------------------------------------------------
      # VERIFY GIT CHANGES
      # ------------------------------------------------------

      - name: Verify Git changes
        if: steps.generate.outputs.quota_exhausted != 'true'
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — GIT CHANGE VERIFICATION"
          echo "============================================================"

          git status --short

          CHANGED="$(git status --porcelain -- \
            'public/data/day-*.json' || true)"

          if [ -z "$CHANGED" ]; then
            echo "No new lesson file was generated."
            echo "Nothing to commit."
            exit 0
          fi

          echo "Generated lesson change:"
          echo "$CHANGED"

      # ------------------------------------------------------
      # COMMIT + PUSH
      # ------------------------------------------------------

      - name: Commit generated lesson
        if: steps.generate.outputs.quota_exhausted != 'true'
        run: |
          set -euo pipefail

          git add public/data/day-*.json

          if git diff --cached --quiet; then
            echo "No new lesson to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: generate daily NEET lesson"

          git push origin HEAD:main

          echo "============================================================"
          echo " DAILY LESSON COMMITTED SUCCESSFULLY"
          echo "============================================================"
