name: VIDHWAAN NEET — Production Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidhwaan-neet-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Optimize and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PAGES_PROJECT: vidhwaan-neet

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # ============================================================
      # SOURCE VALIDATION
      # ============================================================

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — SOURCE VALIDATION"
          echo "============================================================"

          npm ci
          npm run validate

          test -f public/index.html
          test -f public/manifest.json
          test -f public/sw.js
          test -f public/js/app.js
          test -f public/css/main.css
          test -f public/data/app-config.json
          test -f public/data/syllabus.json

          test -d public/icons

          echo
          echo "Production source structure: VALID"

      # ============================================================
      # JAVASCRIPT SYNTAX CHECK
      # ============================================================

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail

          node --check public/js/app.js
          node --check public/sw.js

          echo "JavaScript syntax: VALID"

      # ============================================================
      # INSTALL BUILD TOOLS
      #
      # IMPORTANT:
      # Do not rely on npx finding javascript-obfuscator.
      # Install the CLI packages explicitly.
      # ============================================================

      - name: Install production build tools
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-save \
            html-minifier-terser \
            javascript-obfuscator \
            terser \
            lightningcss

      # ============================================================
      # CREATE CLEAN DIST
      # ============================================================

      - name: Create production directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          cp public/index.html dist/index.html
          cp public/manifest.json dist/manifest.json
          cp public/sw.js dist/sw.js

          cp -R public/data dist/data
          cp -R public/icons dist/icons

          mkdir -p dist/js
          mkdir -p dist/css

      # ============================================================
      # MINIFY HTML
      # ============================================================

      - name: Minify HTML
        shell: bash
        run: |
          set -euo pipefail

          npx --no-install html-minifier-terser \
            public/index.html \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css \
            --minify-js \
            --output dist/index.html

      # ============================================================
      # OBFUSCATE + MINIFY APPLICATION JAVASCRIPT
      #
      # app.js remains functionally the same.
      # ============================================================

      - name: Minify and obfuscate app.js
        shell: bash
        run: |
          set -euo pipefail

          npx --no-install javascript-obfuscator \
            public/js/app.js \
            --output dist/js/app.js \
            --compact true \
            --control-flow-flattening false \
            --dead-code-injection false \
            --debug-protection false \
            --disable-console-output false \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75

      # ============================================================
      # MINIFY SERVICE WORKER
      #
      # sw.js MUST remain named sw.js.
      # ============================================================

      - name: Minify service worker
        shell: bash
        run: |
          set -euo pipefail

          npx --no-install terser \
            public/sw.js \
            --compress \
            --mangle \
            --format comments=false \
            --output dist/sw.js

      # ============================================================
      # MINIFY CSS
      # ============================================================

      - name: Minify CSS
        shell: bash
        run: |
          set -euo pipefail

          npx --no-install lightningcss \
            --minify \
            public/css/main.css \
            -o dist/css/main.css

      # ============================================================
      # HASH JS + CSS
      #
      # Cache busting:
      # app.js  -> app.<hash>.js
      # main.css -> main.<hash>.css
      # ============================================================

      - name: Hash production assets
        shell: bash
        run: |
          set -euo pipefail

          APP_HASH="$(sha256sum dist/js/app.js | cut -c1-12)"
          CSS_HASH="$(sha256sum dist/css/main.css | cut -c1-12)"

          mv dist/js/app.js "dist/js/app.${APP_HASH}.js"
          mv dist/css/main.css "dist/css/main.${CSS_HASH}.css"

          echo "APP_HASH=${APP_HASH}"
          echo "CSS_HASH=${CSS_HASH}"

          echo "${APP_HASH}" > dist/js/.app-hash
          echo "${CSS_HASH}" > dist/css/.css-hash

      # ============================================================
      # UPDATE HTML REFERENCES
      # ============================================================

      - name: Update hashed asset references
        shell: bash
        run: |
          set -euo pipefail

          APP_HASH="$(cat dist/js/.app-hash)"
          CSS_HASH="$(cat dist/css/.css-hash)"

          python3 - <<PY
          from pathlib import Path

          index = Path("dist/index.html")

          text = index.read_text()

          text = text.replace(
              "./js/app.js",
              "./js/app.${APP_HASH}.js"
          )

          text = text.replace(
              "./css/main.css",
              "./css/main.${CSS_HASH}.css"
          )

          index.write_text(text)
          PY

          rm -f dist/js/.app-hash
          rm -f dist/css/.css-hash

      # ============================================================
      # VERIFY HASHED REFERENCES
      # ============================================================

      - name: Verify production asset references
        shell: bash
        run: |
          set -euo pipefail

          APP_FILE="$(find dist/js -maxdepth 1 -type f -name 'app.*.js' | head -1)"
          CSS_FILE="$(find dist/css -maxdepth 1 -type f -name 'main.*.css' | head -1)"

          test -n "$APP_FILE"
          test -n "$CSS_FILE"

          APP_NAME="$(basename "$APP_FILE")"
          CSS_NAME="$(basename "$CSS_FILE")"

          grep -Fq "./js/${APP_NAME}" dist/index.html
          grep -Fq "./css/${CSS_NAME}" dist/index.html

          test ! -f dist/js/app.js
          test ! -f dist/css/main.css

          echo "JavaScript: ${APP_NAME}"
          echo "CSS       : ${CSS_NAME}"
          echo "HTML asset references: VALID"

      # ============================================================
      # VERIFY PWA
      # ============================================================

      - name: Verify PWA production files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PWA VERIFICATION"
          echo "============================================================"

          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js

          test -f dist/data/app-config.json
          test -f dist/data/syllabus.json

          test -d dist/icons
          test -n "$(find dist/icons -type f | head -1)"

          grep -Fq './manifest.json' dist/index.html
          grep -Fq './sw.js' dist/index.html

          echo "index.html : OK"
          echo "manifest   : OK"
          echo "sw.js      : OK"
          echo "data       : OK"
          echo "icons      : OK"
          echo "PWA files  : VALID"

      # ============================================================
      # IMPORTANT:
      # DO NOT REQUIRE DAY JSON FILES.
      #
      # They are generated later by the daily AI workflow.
      # Deployment must work even when zero day files exist.
      # ============================================================

      - name: Verify daily lesson files are not required
        shell: bash
        run: |
          set -euo pipefail

          echo "Daily lesson JSON files are NOT required for deployment."

          if find dist/data -maxdepth 1 -type f -name 'day-*.json' | grep -q .; then
            echo "Existing daily lesson files detected; preserving them."
          else
            echo "No daily lesson files currently present — this is valid."
          fi

      # ============================================================
      # FINAL DIST INSPECTION
      # ============================================================

      - name: Production build summary
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo " VIDHWAAN NEET — PRODUCTION BUILD COMPLETE"
          echo "============================================================"
          echo

          echo "Production files:"
          find dist -type f | sort

          echo
          echo "Production size:"
          du -sh dist

      # ============================================================
      # ENSURE CLOUDFLARE PAGES PROJECT EXISTS
      #
      # This prevents:
      # "The Pages project does not exist."
      # ============================================================

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Cloudflare Pages project..."

          if npx wrangler pages project list --json \
              | node -e '
                let data="";
                process.stdin.on("data",c=>data+=c);
                process.stdin.on("end",()=>{
                  try {
                    const projects=JSON.parse(data);
                    const found=projects.some(
                      p => p.name === process.argv[1]
                    );
                    process.exit(found ? 0 : 1);
                  } catch(e) {
                    process.exit(2);
                  }
                });
              ' "$CF_PAGES_PROJECT"
          then
            echo "Cloudflare Pages project exists: $CF_PAGES_PROJECT"
          else
            echo "Creating Cloudflare Pages project: $CF_PAGES_PROJECT"

            npx wrangler pages project create "$CF_PAGES_PROJECT" \
              --production-branch main

            echo "Cloudflare Pages project created."
          fi

      # ============================================================
      # DEPLOY TO CLOUDFLARE PAGES
      #
      # NOT Workers.
      # NOT wrangler deploy.
      #
      # Only dist/ is uploaded.
      # ============================================================

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Deployment complete
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo " VIDHWAAN NEET — DEPLOYMENT SUCCESSFUL"
          echo "============================================================"
          echo
          echo "Cloudflare Pages project:"
          echo "$CF_PAGES_PROJECT"
          echo
          echo "Production branch:"
          echo "main"
          echo
          echo "Deployment directory:"
          echo "dist/"
          echo
          echo "Daily AI lesson generation:"
          echo "SEPARATE WORKFLOW"
          echo
          echo "============================================================"
