name: VIDHWAAN NEET — Cloudflare Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidhwaan-neet-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Optimize and Deploy
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # SOURCE VALIDATION
      # ============================================================

      - name: Validate syllabus
        run: |
          echo "============================================================"
          echo " VIDHWAAN NEET — SOURCE VALIDATION"
          echo "============================================================"

          npm run validate

      - name: Validate generator syntax
        run: |
          echo "============================================================"
          echo " GENERATOR SYNTAX VALIDATION"
          echo "============================================================"

          node --check generator/generate-day.js

      # ============================================================
      # VERIFY PUBLIC APPLICATION
      # ============================================================

      - name: Verify production files
        run: |
          set -e

          echo "============================================================"
          echo " VIDHWAAN NEET — PRODUCTION FILE CHECK"
          echo "============================================================"

          test -f public/index.html
          test -f public/manifest.json
          test -f public/sw.js
          test -f public/js/app.js
          test -f public/css/main.css
          test -f public/data/app-config.json
          test -f public/data/syllabus.json

          echo "index.html          : OK"
          echo "manifest.json       : OK"
          echo "service worker      : OK"
          echo "app.js              : OK"
          echo "main.css            : OK"
          echo "app-config.json     : OK"
          echo "syllabus.json       : OK"

      # ============================================================
      # BUILD CLEAN DEPLOYMENT DIRECTORY
      # ============================================================

      - name: Prepare production directory
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          cp -R public/. dist/

          echo "Production directory created."

      # ============================================================
      # REMOVE DEVELOPMENT / BACKUP FILES
      # ============================================================

      - name: Remove backup and development files
        run: |
          set -e

          find dist -type f \( \
            -name "*.backup*" -o \
            -name "*.before-*" -o \
            -name "*.bak" -o \
            -name "*.tmp" \
          \) -delete

          echo "Backup/development files removed."

      # ============================================================
      # MINIFY HTML
      # ============================================================

      - name: Minify HTML
        run: |
          npx --yes html-minifier-terser \
            dist/index.html \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            -o dist/index.html

          echo "HTML minified."

      # ============================================================
      # MINIFY JAVASCRIPT
      # ============================================================

      - name: Minify JavaScript
        run: |
          set -e

          find dist -type f -name "*.js" \
            ! -name "sw.js" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Minifying: $file"

            npx --yes terser "$file" \
              --compress \
              --mangle \
              --format comments=false \
              -o "$file"
          done

          echo "JavaScript minification complete."

      # ============================================================
      # MINIFY CSS
      # ============================================================

      - name: Minify CSS
        run: |
          set -e

          find dist -type f -name "*.css" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Minifying: $file"

            npx --yes clean-css-cli \
              -o "$file" \
              "$file"
          done

          echo "CSS minification complete."

      # ============================================================
      # HASH STATIC ASSETS
      # ============================================================

      - name: Hash static assets
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path("dist")

          files = []

          for pattern in [
              "**/*.js",
              "**/*.css"
          ]:
              files.extend(root.glob(pattern))

          files = [
              p for p in files
              if p.name != "sw.js"
          ]

          replacements = {}

          for file in files:
              data = file.read_bytes()

              digest = hashlib.sha256(data).hexdigest()[:12]

              new_name = f"{file.stem}.{digest}{file.suffix}"

              new_file = file.with_name(new_name)

              file.rename(new_file)

              replacements[
                  file.relative_to(root).as_posix()
              ] = new_file.relative_to(root).as_posix()

          # Update HTML references.
          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  text = text.replace(old, new)

              html.write_text(text, encoding="utf-8")

          # Update service worker references.
          sw = root / "sw.js"

          if sw.exists():
              text = sw.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  text = text.replace(old, new)

              sw.write_text(text, encoding="utf-8")

          print("Hashed assets:")
          for old, new in replacements.items():
              print(f"  {old} -> {new}")
          PY

          echo "Static assets hashed."

      # ============================================================
      # VERIFY NO SOURCE FILES ARE BEING DEPLOYED
      # ============================================================

      - name: Production security check
        run: |
          set -e

          if find dist -type f \( \
            -name "*.backup*" -o \
            -name "*.before-*" -o \
            -name "*.key" -o \
            -name "*.pem" -o \
            -name ".env*" \
          \) | grep -q .; then
            echo "ERROR: Sensitive/development files found in dist."
            find dist -type f
            exit 1
          fi

          echo "Production security check: PASS."

      # ============================================================
      # FINAL DEPLOYMENT CONTENT CHECK
      # ============================================================

      - name: Show deployment contents
        run: |
          echo "============================================================"
          echo " FINAL CLOUDFLARE DEPLOYMENT CONTENT"
          echo "============================================================"

          find dist -type f | sort

          echo
          echo "============================================================"
          echo " DEPLOYMENT SIZE"
          echo "============================================================"

          du -sh dist

      # ============================================================
      # CLOUDFLARE PAGES DEPLOY
      # ============================================================

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "Cloudflare credentials detected."

          npx --yes wrangler pages deploy dist \
            --project-name=vidhwaan-neet \
            --branch=main

          echo "============================================================"
          echo " VIDHWAAN NEET — CLOUDFLARE DEPLOYMENT SUCCESS"
          echo "============================================================"
