name: VIDHWAAN NEET — Production CDN Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidhwaan-neet-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Optimize and Deploy NEET
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PAGES_PROJECT: vidhwaan-neet

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ============================================================
      # INSTALL PROJECT DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # SOURCE VALIDATION
      # ============================================================

      - name: Validate syllabus
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — SOURCE VALIDATION"
          echo "============================================================"

          npm run validate

      # ============================================================
      # VERIFY REAL PRODUCTION STRUCTURE
      # ============================================================

      - name: Verify production files
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PRODUCTION FILE VERIFICATION"
          echo "============================================================"

          required_files=(
            "public/index.html"
            "public/manifest.json"
            "public/sw.js"
            "public/js/app.js"
            "public/css/main.css"
            "public/data/app-config.json"
            "public/data/syllabus.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing production file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          if [ ! -d "public/icons" ]; then
            echo "ERROR: Missing public/icons directory"
            exit 1
          fi

          echo "OK: public/icons"

          echo
          echo "Production structure verified."

      # ============================================================
      # VERIFY NO DAILY LESSONS ARE REQUIRED FOR DEPLOYMENT
      # ============================================================

      - name: Verify frontend does not require generated day files
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " DAILY LESSON DEPLOYMENT CHECK"
          echo "============================================================"

          echo "Daily day-XXX.json files are NOT required for frontend deployment."
          echo "They are generated separately by the daily AI lesson workflow."

          echo
          echo "Existing public/data files:"
          find public/data -maxdepth 1 -type f -printf '%f\n' | sort

      # ============================================================
      # INSTALL BUILD OPTIMIZATION TOOLS
      # ============================================================

      - name: Install production optimization tools
        run: |
          npm install --no-save \
            html-minifier-terser \
            terser \
            javascript-obfuscator \
            lightningcss

      # ============================================================
      # BUILD PRODUCTION DIRECTORY
      # ============================================================

      - name: Build production CDN directory
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — PRODUCTION BUILD"
          echo "============================================================"

          rm -rf dist
          mkdir -p dist

          # --------------------------------------------------------
          # COPY STATIC APPLICATION
          # --------------------------------------------------------

          cp public/index.html dist/index.html
          cp public/manifest.json dist/manifest.json
          cp public/sw.js dist/sw.js

          cp -R public/data dist/data
          cp -R public/icons dist/icons

          mkdir -p dist/js
          mkdir -p dist/css

          # --------------------------------------------------------
          # MINIFY HTML
          # --------------------------------------------------------

          npx html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            public/index.html \
            -o dist/index.html

          # --------------------------------------------------------
          # MINIFY + OBFUSCATE MAIN APP
          # --------------------------------------------------------

          npx javascript-obfuscator \
            public/js/app.js \
            --output dist/js/app.js \
            --compact true \
            --control-flow-flattening false \
            --dead-code-injection false \
            --debug-protection false \
            --disable-console-output true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75

          # --------------------------------------------------------
          # MINIFY SERVICE WORKER
          #
          # sw.js MUST remain named sw.js because index/app
          # register it using ./sw.js.
          # --------------------------------------------------------

          npx terser public/sw.js \
            --compress \
            --mangle \
            --format comments=false \
            -o dist/sw.js

          # --------------------------------------------------------
          # MINIFY CSS
          # --------------------------------------------------------

          npx lightningcss \
            --minify \
            public/css/main.css \
            -o dist/css/main.css

          # --------------------------------------------------------
          # HASH CACHEABLE JS/CSS ASSETS
          # --------------------------------------------------------

          APP_HASH=$(
            sha256sum dist/js/app.js |
            cut -c1-12
          )

          CSS_HASH=$(
            sha256sum dist/css/main.css |
            cut -c1-12
          )

          mv dist/js/app.js "dist/js/app.${APP_HASH}.js"
          mv dist/css/main.css "dist/css/main.${CSS_HASH}.css"

          # --------------------------------------------------------
          # UPDATE INDEX.HTML TO HASHED ASSETS
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("dist/index.html").read_text()

          js_files = list(Path("dist/js").glob("app.*.js"))
          css_files = list(Path("dist/css").glob("main.*.css"))

          if len(js_files) != 1:
              raise SystemExit("Expected exactly one hashed app.js")

          if len(css_files) != 1:
              raise SystemExit("Expected exactly one hashed main.css")

          js_name = js_files[0].name
          css_name = css_files[0].name

          html = re.sub(
              r'(src=["\'])\.?/js/app\.js(["\'])',
              rf'\1./js/{js_name}\2',
              html
          )

          html = re.sub(
              r'(href=["\'])\.?/css/main\.css(["\'])',
              rf'\1./css/{css_name}\2',
              html
          )

          Path("dist/index.html").write_text(html)

          print(f"Hashed JS : {js_name}")
          print(f"Hashed CSS: {css_name}")
          PY

          # --------------------------------------------------------
          # VERIFY REFERENCES
          # --------------------------------------------------------

          if ! grep -q 'js/app\.' dist/index.html; then
            echo "ERROR: Hashed app.js not referenced by index.html"
            exit 1
          fi

          if ! grep -q 'css/main\.' dist/index.html; then
            echo "ERROR: Hashed main.css not referenced by index.html"
            exit 1
          fi

          # --------------------------------------------------------
          # VERIFY PWA FILES
          # --------------------------------------------------------

          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/data/app-config.json
          test -f dist/data/syllabus.json

          test -d dist/icons
          test -n "$(find dist/icons -type f | head -1)"

          echo
          echo "============================================================"
          echo " PRODUCTION BUILD COMPLETE"
          echo "============================================================"

          find dist -type f | sort

      # ============================================================
      # FINAL DIST VALIDATION
      # ============================================================

      - name: Validate production build
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " FINAL CDN BUILD VALIDATION"
          echo "============================================================"

          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/data/app-config.json
          test -f dist/data/syllabus.json

          test -n "$(find dist/js -name 'app.*.js' -type f)"
          test -n "$(find dist/css -name 'main.*.css' -type f)"
          test -n "$(find dist/icons -type f | head -1)"

          if find dist -name '*.backup*' -o -name '*.before-*'; then
            echo "WARNING: backup files found in dist."
          fi

          echo "CDN build is valid."

      # ============================================================
      # CLOUDFLARE AUTHENTICATION
      # ============================================================

      - name: Verify Cloudflare credentials
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "Cloudflare credentials detected."

          npx wrangler whoami

      # ============================================================
      # CREATE CLOUDFLARE PAGES PROJECT IF NECESSARY
      # ============================================================

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " CLOUDFLARE PAGES PROJECT"
          echo "============================================================"

          if npx wrangler pages project list | grep -Fq "$CF_PAGES_PROJECT"; then
            echo "Pages project exists: $CF_PAGES_PROJECT"
          else
            echo "Pages project does not exist."
            echo "Creating: $CF_PAGES_PROJECT"

            npx wrangler pages project create "$CF_PAGES_PROJECT" \
              --production-branch main

            echo "Pages project created."
          fi

      # ============================================================
      # DEPLOY TO CLOUDFLARE PAGES CDN
      # ============================================================

      - name: Deploy production build to Cloudflare Pages
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VIDHWAAN NEET — CLOUDFLARE CDN DEPLOY"
          echo "============================================================"

          npx wrangler pages deploy dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main

          echo
          echo "============================================================"
          echo " DEPLOYMENT SUCCESSFUL"
          echo "============================================================"
