name: VIDHWAAN NEET — Production CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidhwaan-neet-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Optimize and Deploy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. NODE.JS
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          echo "============================================================"
          echo " INSTALLING DEPENDENCIES"
          echo "============================================================"

          npm ci

          echo "Dependencies installed."


      # ============================================================
      # 4. VALIDATE 365-DAY SYLLABUS
      # ============================================================

      - name: Validate syllabus
        run: |
          set -e

          echo "============================================================"
          echo " VIDHWAAN NEET — SOURCE VALIDATION"
          echo "============================================================"

          npm run validate

          echo
          echo "Syllabus validation: PASS"


      # ============================================================
      # 5. VALIDATE GENERATOR JAVASCRIPT
      # ============================================================

      - name: Validate generator syntax
        run: |
          set -e

          echo "============================================================"
          echo " GENERATOR SYNTAX VALIDATION"
          echo "============================================================"

          node --check generator/generate-day.js

          echo "Generator syntax: PASS"


      # ============================================================
      # 6. VERIFY PRODUCTION APPLICATION
      # ============================================================

      - name: Verify production files
        run: |
          set -e

          echo "============================================================"
          echo " PRODUCTION FILE VERIFICATION"
          echo "============================================================"

          required_files="
          public/index.html
          public/manifest.json
          public/sw.js
          public/js/app.js
          public/css/main.css
          public/data/app-config.json
          public/data/syllabus.json
          public/icons/icons-198.png
          public/icons/icons-512.png
          "

          for file in $required_files; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing production file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "Production file verification: PASS"


      # ============================================================
      # 7. CREATE CLEAN DEPLOYMENT DIRECTORY
      # ============================================================

      - name: Create clean production build
        run: |
          set -e

          echo "============================================================"
          echo " CREATING CLEAN PRODUCTION BUILD"
          echo "============================================================"

          rm -rf dist
          mkdir -p dist

          cp -R public/. dist/

          echo "Clean production directory created."


      # ============================================================
      # 8. REMOVE BACKUP / DEVELOPMENT FILES
      # ============================================================

      - name: Remove backup and development files
        run: |
          set -e

          echo "============================================================"
          echo " REMOVING BACKUP / DEVELOPMENT FILES"
          echo "============================================================"

          find dist -type f \( \
            -name "*.backup*" \
            -o -name "*.before-*" \
            -o -name "*.bak" \
            -o -name "*.tmp" \
            -o -name "*~" \
          \) -print -delete

          echo "Backup/development cleanup complete."


      # ============================================================
      # 9. MINIFY HTML
      # ============================================================

      - name: Minify HTML
        run: |
          set -e

          echo "============================================================"
          echo " HTML MINIFICATION"
          echo "============================================================"

          npx --yes html-minifier-terser \
            dist/index.html \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            -o dist/index.html

          echo "HTML minification: PASS"


      # ============================================================
      # 10. MINIFY + MANGLE JAVASCRIPT
      # ============================================================

      - name: Minify and mangle JavaScript
        run: |
          set -e

          echo "============================================================"
          echo " JAVASCRIPT MINIFICATION + MANGLE"
          echo "============================================================"

          find dist -type f -name "*.js" \
            ! -name "sw.js" \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Optimizing: $file"

            npx --yes terser "$file" \
              --compress \
              --mangle \
              --format comments=false \
              -o "$file"

          done

          echo "JavaScript optimization: PASS"


      # ============================================================
      # 11. MINIFY CSS
      # ============================================================

      - name: Minify CSS
        run: |
          set -e

          echo "============================================================"
          echo " CSS MINIFICATION"
          echo "============================================================"

          find dist -type f -name "*.css" \
            -print0 |
          while IFS= read -r -d '' file; do

            echo "Optimizing: $file"

            npx --yes clean-css-cli \
              -o "$file" \
              "$file"

          done

          echo "CSS minification: PASS"


      # ============================================================
      # 12. HASH JS + CSS ASSETS
      # ============================================================

      - name: Hash static assets
        run: |
          set -e

          echo "============================================================"
          echo " STATIC ASSET HASHING"
          echo "============================================================"

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("dist")

          files = []

          for pattern in ("**/*.js", "**/*.css"):
              files.extend(root.glob(pattern))

          files = [
              p for p in files
              if p.name != "sw.js"
          ]

          replacements = {}

          for file in files:
              data = file.read_bytes()

              digest = hashlib.sha256(data).hexdigest()[:12]

              new_file = file.with_name(
                  f"{file.stem}.{digest}{file.suffix}"
              )

              file.rename(new_file)

              old_path = file.relative_to(root).as_posix()
              new_path = new_file.relative_to(root).as_posix()

              replacements[old_path] = new_path

          # --------------------------------------------------------
          # Update HTML references
          # --------------------------------------------------------

          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  text = text.replace(old, new)

              html.write_text(text, encoding="utf-8")

          # --------------------------------------------------------
          # Update service worker references if present
          # --------------------------------------------------------

          sw = root / "sw.js"

          if sw.exists():
              text = sw.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  text = text.replace(old, new)

              sw.write_text(text, encoding="utf-8")

          print("")
          print("Hashed assets:")

          for old, new in replacements.items():
              print(f"{old} -> {new}")
          PY

          echo
          echo "Static asset hashing: PASS"


      # ============================================================
      # 13. VERIFY NO SENSITIVE FILES
      # ============================================================

      - name: Production security check
        run: |
          set -e

          echo "============================================================"
          echo " PRODUCTION SECURITY CHECK"
          echo "============================================================"

          forbidden=$(find dist -type f \( \
            -name "*.env" \
            -name ".env" \
            -name ".env.*" \
            -name "*.pem" \
            -name "*.key" \
            -name "*.secret" \
            -name "*.backup*" \
            -name "*.before-*" \
          \))

          if [ -n "$forbidden" ]; then
            echo "ERROR: Forbidden files detected:"
            echo "$forbidden"
            exit 1
          fi

          echo "No sensitive/development files found."
          echo "Security check: PASS"


      # ============================================================
      # 14. VERIFY PWA
      # ============================================================

      - name: Verify PWA
        run: |
          set -e

          echo "============================================================"
          echo " PWA VERIFICATION"
          echo "============================================================"

          test -f dist/manifest.json
          test -f dist/sw.js

          grep -q 'rel="manifest"' dist/index.html
          grep -q 'serviceWorker' dist/js/*.js 2>/dev/null || true

          echo "Manifest: OK"
          echo "Service worker: OK"
          echo "PWA verification: PASS"


      # ============================================================
      # 15. SHOW FINAL DEPLOYMENT CONTENT
      # ============================================================

      - name: Inspect final deployment
        run: |
          set -e

          echo "============================================================"
          echo " FINAL DEPLOYMENT CONTENT"
          echo "============================================================"

          find dist -type f | sort

          echo
          echo "============================================================"
          echo " DEPLOYMENT SIZE"
          echo "============================================================"

          du -sh dist

          echo
          echo "============================================================"
          echo " FILE COUNT"
          echo "============================================================"

          find dist -type f | wc -l


      # ============================================================
      # 16. CLOUDFLARE CREDENTIAL CHECK
      # ============================================================

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          echo "============================================================"
          echo " CLOUDFLARE CREDENTIAL CHECK"
          echo "============================================================"

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID: configured"
          echo "CLOUDFLARE_API_TOKEN : configured"


      # ============================================================
      # 17. CREATE CLOUDFLARE PAGES PROJECT IF NECESSARY
      # ============================================================

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          PROJECT_NAME="vidhwaan-neet"

          echo "============================================================"
          echo " CLOUDFLARE PAGES PROJECT CHECK"
          echo "============================================================"

          echo "Project: $PROJECT_NAME"

          if npx --yes wrangler pages project list | \
             grep -Fq "$PROJECT_NAME"; then

            echo "Pages project already exists."

          else

            echo "Pages project does not exist."
            echo "Creating Pages project..."

            set +e

            CREATE_OUTPUT=$(
              npx --yes wrangler pages project create "$PROJECT_NAME" \
                --production-branch=main 2>&1
            )

            CREATE_EXIT=$?

            set -e

            echo "$CREATE_OUTPUT"

            if [ "$CREATE_EXIT" -ne 0 ]; then

              echo
              echo "Project creation command returned an error."
              echo "Checking whether the project now exists..."

              if npx --yes wrangler pages project list | \
                 grep -Fq "$PROJECT_NAME"; then

                echo "Project exists. Continuing deployment."

              else

                echo "ERROR: Could not create or locate Cloudflare Pages project."
                exit "$CREATE_EXIT"

              fi

            else

              echo "Pages project created successfully."

            fi

          fi


      # ============================================================
      # 18. CLOUDFLARE PRODUCTION DEPLOYMENT
      # ============================================================

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          echo "============================================================"
          echo " VIDHWAAN NEET — CLOUDFLARE PRODUCTION DEPLOY"
          echo "============================================================"

          npx --yes wrangler pages deploy dist \
            --project-name=vidhwaan-neet \
            --branch=main

          echo
          echo "============================================================"
          echo " VIDHWAAN NEET — DEPLOYMENT SUCCESS"
          echo "============================================================"
