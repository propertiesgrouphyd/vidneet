name: VIDHWAAN NEET — Production PWA DEPLOY

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidhwaan-neet-deploy
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: vidhwaan-neet

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ============================================================
      # INSTALL DEPLOYMENT / PROTECTION TOOLS
      # ============================================================

      - name: Install Production Build Tools
        run: |
          npm install -g wrangler
          npm install -g terser
          npm install -g javascript-obfuscator
          npm install -g clean-css-cli
          npm install -g html-minifier-terser


      # ============================================================
      # VALIDATE SOURCE
      # ============================================================

      - name: Validate NEET Source
        run: |

          echo "============================================================"
          echo " VIDHWAAN NEET — SOURCE VALIDATION"
          echo "============================================================"

          npm ci

          npm run validate

          node --check generator/generate-day.js

          node --check public/js/app.js

          node --check public/sw.js

          test -f public/index.html
          test -f public/css/main.css
          test -f public/js/app.js
          test -f public/sw.js
          test -f public/manifest.json

          test -f public/data/app-config.json
          test -f public/data/syllabus.json

          test -f public/icons/icons-198.png
          test -f public/icons/icons-512.png

          echo
          echo "Source validation: PASSED"


      # ============================================================
      # VERIFY LESSON DATA
      # ============================================================

      - name: Validate Lesson Data
        run: |

          python3 - <<'PY'

          import json
          import re
          from pathlib import Path

          data_dir = Path("public/data")

          files = sorted(
              data_dir.glob("day-*.json"),
              key=lambda p: int(p.stem.split("-")[1])
          )

          print(f"Lesson files found: {len(files)}")

          if len(files) > 365:
              raise SystemExit(
                  "ERROR: More than 365 lesson files exist."
              )

          expected = 1

          for f in files:

              m = re.fullmatch(
                  r"day-(\d{3})",
                  f.stem
              )

              if not m:
                  raise SystemExit(
                      f"Invalid lesson filename: {f.name}"
                  )

              day = int(m.group(1))

              if day != expected:
                  raise SystemExit(
                      f"Lesson sequence broken: "
                      f"expected Day {expected}, found Day {day}"
                  )

              content = json.loads(
                  f.read_text(encoding="utf-8")
              )

              if int(content.get("day", 0)) != day:
                  raise SystemExit(
                      f"{f}: day metadata mismatch"
                  )

              if not content.get("courseDate"):
                  raise SystemExit(
                      f"{f}: missing courseDate"
                  )

              if not content.get("publishAt"):
                  raise SystemExit(
                      f"{f}: missing publishAt"
                  )

              expected += 1

          print("Lesson sequence: VALID")

          PY


      # ============================================================
      # PREPARE PRODUCTION DIST
      # ============================================================

      - name: Prepare Production Dist
        run: |

          rm -rf dist

          mkdir -p dist
          mkdir -p dist/css
          mkdir -p dist/js
          mkdir -p dist/data
          mkdir -p dist/icons

          # HTML
          cp public/index.html dist/

          # CSS
          cp public/css/main.css dist/css/

          # JavaScript
          cp public/js/app.js dist/js/
          cp public/sw.js dist/

          # PWA metadata
          cp public/manifest.json dist/

          # Data
          cp public/data/app-config.json dist/data/
          cp public/data/syllabus.json dist/data/

          # Lessons
          cp public/data/day-*.json dist/data/

          # Icons
          cp public/icons/* dist/icons/

          # Optional favicon if present
          if [ -f public/favicon.ico ]; then
            cp public/favicon.ico dist/
          fi

          echo "Production directory prepared."


      # ============================================================
      # MINIFY HTML
      # ============================================================

      - name: Minify HTML
        run: |

          html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --use-short-doctype \
            dist/index.html \
            -o dist/index.html


      # ============================================================
      # MINIFY CSS
      # ============================================================

      - name: Minify CSS
        run: |

          cleancss \
            -O2 \
            dist/css/main.css \
            -o dist/css/main.css


      # ============================================================
      # MINIFY JAVASCRIPT
      # ============================================================

      - name: Minify JavaScript
        run: |

          terser \
            dist/js/app.js \
            --compress \
            --mangle \
            -o dist/js/app.js


      # ============================================================
      # OBFUSCATE APPLICATION JAVASCRIPT
      # ============================================================

      - name: Obfuscate Application JavaScript
        run: |

          javascript-obfuscator \
            dist/js/app.js \
            --output dist/js/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.20 \
            --disable-console-output true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending true \
            --split-strings true \
            --string-array true \
            --string-array-encoding base64

          echo "Application JavaScript obfuscated."


      # ============================================================
      # MINIFY JSON DATA
      # ============================================================

      - name: Minify JSON Data
        run: |

          python3 - <<'PY'

          import json
          from pathlib import Path

          data_dir = Path("dist/data")

          for path in data_dir.glob("*.json"):

              try:

                  obj = json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

                  path.write_text(
                      json.dumps(
                          obj,
                          ensure_ascii=False,
                          separators=(",", ":")
                      ),
                      encoding="utf-8"
                  )

                  print(
                      f"Minified: {path}"
                  )

              except Exception as e:

                  raise SystemExit(
                      f"Failed JSON validation: "
                      f"{path}: {e}"
                  )

          PY


      # ============================================================
      # GENERATE CONTENT HASH / VERSION
      # ============================================================

      - name: Generate Asset Version
        run: |

          VERSION=$(date +%s)

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Asset version: $VERSION"


      # ============================================================
      # CACHE-BUST PRODUCTION ASSETS
      # ============================================================

      - name: Apply Asset Cache Busting
        run: |

          sed -i \
            "s|href=\"./css/main.css\"|href=\"./css/main.css?v=$VERSION\"|g" \
            dist/index.html

          sed -i \
            "s|src=\"./js/app.js\"|src=\"./js/app.js?v=$VERSION\"|g" \
            dist/index.html

          sed -i \
            "s|href=\"./manifest.json\"|href=\"./manifest.json?v=$VERSION\"|g" \
            dist/index.html

          echo "Cache busting applied."


      # ============================================================
      # PRODUCTION SECURITY HEADERS
      # ============================================================

      - name: Create Cloudflare Production Headers
        run: |

          cat > dist/_headers <<'EOF'

          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: SAMEORIGIN
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: geolocation=(), microphone=(), camera=()

          /index.html
            Cache-Control: no-cache, max-age=0, must-revalidate

          /manifest.json
            Cache-Control: no-cache, max-age=0, must-revalidate

          /sw.js
            Cache-Control: no-cache, max-age=0, must-revalidate

          /data/*
            Cache-Control: no-store, max-age=0, must-revalidate

          /css/*
            Cache-Control: public, max-age=31536000, immutable

          /js/*
            Cache-Control: public, max-age=31536000, immutable

          /icons/*
            Cache-Control: public, max-age=31536000, immutable

          /favicon.ico
            Cache-Control: public, max-age=31536000, immutable

          EOF

          echo "Cloudflare production headers created."


      # ============================================================
      # VERIFY PRODUCTION BUILD
      # ============================================================

      - name: Verify Production Build
        run: |

          echo
          echo "============================================================"
          echo " VIDHWAAN NEET — PRODUCTION BUILD"
          echo "============================================================"

          find dist -type f | sort

          echo
          echo "============================================================"
          echo " LESSON FILES"
          echo "============================================================"

          ls -lh dist/data/day-*.json

          echo
          echo "============================================================"
          echo " BUILD SIZE"
          echo "============================================================"

          du -sh dist

          du -h \
            dist/index.html \
            dist/css/main.css \
            dist/js/app.js \
            dist/sw.js

          echo
          echo "============================================================"
          echo " REQUIRED FILE VALIDATION"
          echo "============================================================"

          test -f dist/index.html
          test -f dist/css/main.css
          test -f dist/js/app.js
          test -f dist/sw.js
          test -f dist/manifest.json

          test -f dist/data/app-config.json
          test -f dist/data/syllabus.json

          test -f dist/icons/icons-198.png
          test -f dist/icons/icons-512.png

          echo
          echo "Production build: PASSED"


      # ============================================================
      # CREATE CLOUDFLARE PAGES PROJECT IF NEEDED
      # ============================================================

      - name: Create Cloudflare Pages Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          if ! wrangler pages project list | grep -q "$PROJECT_NAME"
          then

            echo "Creating Cloudflare Pages project..."

            wrangler pages project create "$PROJECT_NAME" \
              --production-branch main

          else

            echo "Cloudflare Pages project already exists."

          fi


      # ============================================================
      # DEPLOY TO CLOUDFLARE CDN
      # ============================================================

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |

          wrangler pages deploy dist \
            --project-name="$PROJECT_NAME"


      # ============================================================
      # SUCCESS
      # ============================================================

      - name: Deployment Success
        run: |

          echo
          echo "============================================================"
          echo " VIDHWAAN NEET — DEPLOYMENT SUCCESS"
          echo "============================================================"

          echo "Cloudflare Project : $PROJECT_NAME"
          echo "Asset Version      : $VERSION"

          echo
          echo "PRODUCTION:"
          echo "✓ Source validated"
          echo "✓ Syllabus validated"
          echo "✓ Lesson sequence validated"
          echo "✓ HTML minified"
          echo "✓ CSS minified"
          echo "✓ JavaScript minified"
          echo "✓ JavaScript obfuscated"
          echo "✓ JSON data minified"
          echo "✓ Cache busting enabled"
          echo "✓ Production headers created"
          echo "✓ PWA manifest preserved"
          echo "✓ PWA service worker preserved"
          echo "✓ Daily lesson data deployed"
          echo "✓ Cloudflare CDN deployment complete"

          echo
          echo "VIDHWAAN NEET IS LIVE."
