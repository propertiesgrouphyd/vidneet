name: VIDHWAAN NEET — Production Cloudflare Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidhwaan-neet-production
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  WORKER_NAME: "vidhwaan-neet"

jobs:
  deploy:
    name: Validate, Optimize and Deploy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install dependencies
        run: npm ci

      # ============================================================
      # SOURCE VALIDATION
      # ============================================================

      - name: Validate syllabus
        run: |
          echo "============================================================"
          echo " VIDHWAAN NEET — SOURCE VALIDATION"
          echo "============================================================"

          npm run validate

      - name: Validate generator
        run: |
          node --check generator/generate-day.js

      # ============================================================
      # VERIFY PRODUCTION SOURCE
      # ============================================================

      - name: Verify production files
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo " PRODUCTION FILE VERIFICATION"
          echo "============================================================"

          required_files=(
            "public/index.html"
            "public/manifest.json"
            "public/sw.js"
            "public/js/app.js"
            "public/css/main.css"
            "public/data/app-config.json"
            "public/data/syllabus.json"
            "public/icons/icons-198.png"
            "public/icons/icons-512.png"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing production file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "Production source verification PASSED."

      # ============================================================
      # CREATE BUILD DIRECTORY
      # ============================================================

      - name: Prepare production build
        shell: bash
        run: |
          set -e

          rm -rf dist
          mkdir -p dist

          cp -R public/. dist/

          echo "Production source copied to dist/."

      # ============================================================
      # INSTALL BUILD OPTIMIZATION TOOLS
      # ============================================================

      - name: Install production optimization tools
        run: |
          npm install --no-save \
            terser \
            javascript-obfuscator \
            clean-css-cli \
            html-minifier-terser

      # ============================================================
      # MINIFY HTML
      # ============================================================

      - name: Minify HTML
        run: |
          npx html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            dist/index.html \
            -o dist/index.html

          echo "HTML minified."

      # ============================================================
      # MINIFY + OBFUSCATE JAVASCRIPT
      # ============================================================

      - name: Minify and obfuscate JavaScript
        shell: bash
        run: |
          set -e

          mkdir -p build-tmp

          npx terser \
            dist/js/app.js \
            --compress \
            --mangle \
            --comments false \
            -o build-tmp/app.min.js

          npx javascript-obfuscator \
            build-tmp/app.min.js \
            --output dist/js/app.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.35 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.10 \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --self-defending false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --transform-object-keys true \
            --unicode-escape-sequence false

          rm -rf build-tmp

          echo "JavaScript minified and obfuscated."

      # ============================================================
      # MINIFY CSS
      # ============================================================

      - name: Minify CSS
        run: |
          npx cleancss \
            -O2 \
            -o dist/css/main.css \
            dist/css/main.css

          echo "CSS minified."

      # ============================================================
      # CONTENT HASH JS / CSS / ICONS
      #
      # JSON files are intentionally NOT renamed because the
      # application dynamically loads lesson/data URLs.
      # ============================================================

      - name: Content hash static assets
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path("dist")

          assets = [
              root / "js" / "app.js",
              root / "css" / "main.css",
              root / "icons" / "icons-198.png",
              root / "icons" / "icons-512.png",
          ]

          replacements = {}

          for path in assets:
              if not path.exists():
                  raise SystemExit(f"Missing asset: {path}")

              digest = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()[:16]

              new_name = f"{path.stem}.{digest}{path.suffix}"
              new_path = path.with_name(new_name)

              path.rename(new_path)

              replacements[
                  path.relative_to(root).as_posix()
              ] = new_path.relative_to(root).as_posix()

              print(
                  f"HASHED: {path.relative_to(root)}"
                  f" -> {new_path.relative_to(root)}"
              )

          # ----------------------------------------------------------
          # Rewrite references in index.html
          # ----------------------------------------------------------

          index = root / "index.html"
          text = index.read_text(encoding="utf-8")

          for old, new in replacements.items():
              text = text.replace(
                  f"./{old}",
                  f"./{new}"
              )

              text = text.replace(
                  old,
                  new
              )

          index.write_text(text, encoding="utf-8")

          # ----------------------------------------------------------
          # Rewrite manifest icon references
          # ----------------------------------------------------------

          manifest = root / "manifest.json"

          if manifest.exists():
              data = json.loads(
                  manifest.read_text(encoding="utf-8")
              )

              for icon in data.get("icons", []):
                  src = icon.get("src")

                  if not src:
                      continue

                  normalized = src.lstrip("./")

                  if normalized in replacements:
                      icon["src"] = "./" + replacements[normalized]

              manifest.write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      separators=(",", ":")
                  ) + "\n",
                  encoding="utf-8"
              )

          # ----------------------------------------------------------
          # Rewrite service worker references if present.
          # ----------------------------------------------------------

          sw = root / "sw.js"

          if sw.exists():
              sw_text = sw.read_text(encoding="utf-8")

              for old, new in replacements.items():
                  sw_text = sw_text.replace(
                      f"./{old}",
                      f"./{new}"
                  )

                  sw_text = sw_text.replace(
                      old,
                      new
                  )

              sw.write_text(
                  sw_text,
                  encoding="utf-8"
              )

          print("Asset references rewritten successfully.")
          PY

      # ============================================================
      # FINAL PWA / DATA CHECK
      # ============================================================

      - name: Verify optimized production build
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo " FINAL PRODUCTION BUILD VERIFICATION"
          echo "============================================================"

          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js

          test -d dist/js
          test -d dist/css
          test -d dist/icons
          test -d dist/data

          test "$(find dist/js -maxdepth 1 -name 'app.*.js' | wc -l)" -eq 1
          test "$(find dist/css -maxdepth 1 -name 'main.*.css' | wc -l)" -eq 1
          test "$(find dist/icons -maxdepth 1 -name 'icons-198.*.png' | wc -l)" -eq 1
          test "$(find dist/icons -maxdepth 1 -name 'icons-512.*.png' | wc -l)" -eq 1

          python3 <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("dist/manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          if not manifest.get("name"):
              raise SystemExit("manifest.json missing name")

          if manifest.get("display") != "standalone":
              raise SystemExit(
                  "manifest.json must use display=standalone"
              )

          for icon in manifest.get("icons", []):
              src = icon.get("src", "")

              if not Path("dist", src.lstrip("./")).exists():
                  raise SystemExit(
                      f"Manifest icon missing: {src}"
                  )

          print("PWA manifest verification PASSED.")
          PY

          echo
          echo "Production build verification PASSED."

      # ============================================================
      # CLOUDFLARE WRANGLER CONFIG
      # ============================================================

      - name: Create Wrangler configuration
        shell: bash
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "vidhwaan-neet",
            "compatibility_date": "2026-08-29",
            "assets": {
              "directory": "./dist"
            }
          }
          EOF

          echo "Wrangler configuration created."

      # ============================================================
      # CLOUDFLARE AUTHENTICATION CHECK
      # ============================================================

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          echo "Cloudflare credentials detected."

      # ============================================================
      # CLOUDFLARE WORKERS DEPLOYMENT
      # ============================================================

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@4.127.1 deploy

      # ============================================================
      # COMPLETE
      # ============================================================

      - name: Deployment complete
        run: |
          echo "============================================================"
          echo " VIDHWAAN NEET — DEPLOYMENT SUCCESSFUL"
          echo "============================================================"
          echo
          echo "Worker : vidhwaan-neet"
          echo "Assets : dist/"
          echo
          echo "Cloudflare Workers Static Assets deployment completed."
          echo "============================================================"
